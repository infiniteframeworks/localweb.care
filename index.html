<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://localweb.care/#website",
        "url": "https://localweb.care/",
        "name": "localweb.care",
        "publisher": { "@id": "https://localweb.care/#business" }
      },
      {
        "@type": "ProfessionalService",
        "@id": "https://localweb.care/#business",
        "name": "localweb.care",
        "url": "https://localweb.care/",
        "email": "hello@localweb.care",
        "description": "Handcrafted websites for local businesses — built by a real person, not an agency. Honest pricing, thoughtful design, and someone who actually picks up the phone.",
        "founder": { "@id": "https://localweb.care/about/#jim" },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Web Services",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Site redesigns" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "SEO and conversion optimization" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Google Ads management" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Online stores" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Ongoing maintenance" } }
          ]
        }
      }
    ]
  }
  </script>
  <style>html{background:#FAF3E3}</style>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 40px;
      text-align: center;
      padding: 24px;
    }

    .hero-wordmark {
      font-family: var(--font-display);
      font-size: clamp(52px, 10vw, 80px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      position: relative;
    }

    .hero-wordmark .local {
      color: var(--terracotta);
    }

    .hero-wordmark .webcare {
      color: var(--stoop-navy);
    }

    .hero-wordmark .porch-dot {
      position: absolute;
      width: 3em;
      height: 3em;
      background: var(--porch-light);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
      opacity: 0.25;
    }

    .tagline {
      font-family: var(--font-accent);
      font-size: clamp(28px, 5vw, 42px);
      color: var(--muted);
      margin-top: -20px;
    }
  </style>
</head>

<body>
  <div class="seeds-bg" aria-hidden="true">
    <svg class="seed" viewBox="-105 -96 210 192" xmlns="http://www.w3.org/2000/svg" fill="none"><circle cx="0" cy="0" r="50"/><circle cx="50" cy="0" r="50"/><circle cx="25" cy="43.3" r="50"/><circle cx="-25" cy="43.3" r="50"/><circle cx="-50" cy="0" r="50"/><circle cx="-25" cy="-43.3" r="50"/><circle cx="25" cy="-43.3" r="50"/></svg>
    <svg class="seed" viewBox="-105 -96 210 192" xmlns="http://www.w3.org/2000/svg" fill="none"><circle cx="0" cy="0" r="50"/><circle cx="50" cy="0" r="50"/><circle cx="25" cy="43.3" r="50"/><circle cx="-25" cy="43.3" r="50"/><circle cx="-50" cy="0" r="50"/><circle cx="-25" cy="-43.3" r="50"/><circle cx="25" cy="-43.3" r="50"/></svg>
    <svg class="seed" viewBox="-105 -96 210 192" xmlns="http://www.w3.org/2000/svg" fill="none"><circle cx="0" cy="0" r="50"/><circle cx="50" cy="0" r="50"/><circle cx="25" cy="43.3" r="50"/><circle cx="-25" cy="43.3" r="50"/><circle cx="-50" cy="0" r="50"/><circle cx="-25" cy="-43.3" r="50"/><circle cx="25" cy="-43.3" r="50"/></svg>
  </div>
  <header>
    <a href="/" class="logo">localweb.care</a>
  </header>
  <h1 class="hero-wordmark">
    <span class="local">local</span><span class="webcare">web.<span class="porch-dot"></span>care</span>
  </h1>
  <p class="tagline">local websites done right</p>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
    <a href="contact/" class="btn btn-submit">Let's chat</a>
    <a href="about/" class="btn btn-ghost">Tell me more</a>
  </div>
  <p style="font-family:var(--font-body);font-size:13px;color:var(--muted);margin-top:-16px;">Just want to dive in? <a href="onboarding/" style="color:var(--muted);text-underline-offset:3px;">Fill out the questionnaire.</a></p>
