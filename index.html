  <meta property="og:title" content="Local Website Design for Small Businesses | localweb.care" />
  <meta property="og:description"
    content="Handcrafted websites for local businesses — built by a real person, not an agency. Honest pricing, thoughtful design, and someone who actually picks up the phone." />
  <meta name="twitter:card" content="summary_large_image" />

    content="Handcrafted websites for local businesses — built by a real person, not an agency. Honest pricing, thoughtful design, and someone who actually picks up the phone." />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "localweb.care",
    "description": "Handcrafted websites for local businesses",

  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 40px;
      text-align: center;
      padding: 24px;
    }

    .hero-wordmark {
      font-family: var(--font-display);
      font-size: clamp(52px, 10vw, 80px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      position: relative;
    }

    .hero-wordmark .local {
      color: var(--terracotta);
    }

    .hero-wordmark .webcare {
      color: var(--stoop-navy);
    }

    .hero-wordmark .porch-dot {
      position: absolute;
      width: 3em;
      height: 3em;
      background: var(--porch-light);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
      opacity: 0.25;
    }

    .tagline {
      font-family: var(--font-accent);
      font-size: clamp(28px, 5vw, 42px);
      color: var(--muted);
      margin-top: -20px;
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html" class="logo">localweb.care</a>
  </header>
  <h1 class="hero-wordmark">
    <span class="local">local</span><span class="webcare">web.<span class="porch-dot"></span>care</span>
  </h1>
  <p class="tagline">local websites done right</p>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
    <a href="contact/" class="btn btn-submit">Let's chat</a>
    <a href="about/" class="btn btn-ghost">Tell me more</a>
  </div>
</body>

</html>
